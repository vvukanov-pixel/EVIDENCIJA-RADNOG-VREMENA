<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evidencija Radnika</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    h2 { margin-top: 0; color: #38bdf8; text-align: center; }
    label { display: block; font-weight: 600; margin-top: 16px; margin-bottom: 6px; color: #cbd5e1; }
    select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      font-size: 16px;
      box-sizing: border-box;
      background: #0f172a;
      color: #fff;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      font-weight: 600;
      margin-top: 24px;
      cursor: pointer;
      padding: 14px;
    }
    button:disabled { background: #475569; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="card">
  <h2>⏱️ Evidencija Radnog Vremena</h2>

  <label>Odaberite radnika:</label>
  <select id="workerSelect">
    <option value="ZLATKO RADIŠ">ZLATKO RADIŠ</option>
    <option value="SINIŠA PRAVICA">SINIŠA PRAVICA</option>
    <option value="SLAVEN PUHALO">SLAVEN PUHALO</option>
    <option value="NIKOLA MRDIĆ">NIKOLA MRDIĆ</option>
    <option value="LJUBIŠA DOŠLO">LJUBIŠA DOŠLO</option>
    <option value="RANKO JANJIĆ">RANKO JANJIĆ</option>
    <option value="BRANISLAV BEGENUŠIĆ">BRANISLAV BEGENUŠIĆ</option>
    <option value="MIODRAG ĆERANIĆ">MIODRAG ĆERANIĆ</option>
    <option value="Radnik 9">Radnik 9</option>
    <option value="Radnik 10">Radnik 10</option>
  </select>

  <label>Radnja:</label>
  <select id="actionType">
    <option value="Prijava">🟢 Prijava (Dolazak na posao)</option>
    <option value="Odjava">🔴 Odjava (Odlazak s posla)</option>
  </select>

  <button id="submitBtn" onclick="recordAttendance()">Zabilježi u Google Tablicu</button>
</div>

<script>
  const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbzj4_gblGjt68M1obNJJOjnV8TN6yCu6WzuWL-BSC5aGUI_F4dLdhlph4JnPpdZ_8NyA/exec";

  async function recordAttendance() {
    const worker = document.getElementById('workerSelect').value;
    const action = document.getElementById('actionType').value;
    const btn = document.getElementById('submitBtn');

    btn.disabled = true;
    btn.innerText = "Spremanje u tablicu...";

    try {
      await fetch(GOOGLE_SHEET_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ worker: worker, action: action })
      });

      alert(`✅ Uspjeh: ${worker} (${action}) je upisan u Google tablicu knjigovođi!`);
    } catch (e) {
      alert("❌ Došlo je do greške: " + e);
    } finally {
      btn.disabled = false;
      btn.innerText = "Zabilježi u Google Tablicu";
    }
  }
</script>

</body>
</html>
